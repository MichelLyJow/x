class Counter {
  constructor(start = 0) {
    this.value = start;
  }

  increment() {
    return ++this.value;
  }
}

const counter = new Counter();
const names = ['alpha', 'beta', 'gamma'];

names.forEach((name) => {
  console.log(name + ': ' + counter.increment());
});

 if(t.id=='rb'){drawer(false);return runFile()}toast('Not available in this demo')};
$('#sd').addEventListener('pointerdown',e=>{const r=e.target.closest('[data-f]');lp=0;if(!r||side!='files')return;lpT=setTimeout(()=>{lp=1;const f=r.dataset.f;if(confirm('Delete '+f+'?')){delete files[f];save();open.includes(f)?closeTab(f):0;renderSide()}},600)});
['pointerup','pointercancel','pointermove'].forEach(t=>$('#sd').addEventListener(t,()=>clearTimeout(lpT)));

const CM=[['File: New File\u2026',()=>newFile()],['File: Open File from Device\u2026',()=>pickFiles()],['File: Download Active File',()=>download()],['File: Rename Active File\u2026',()=>rename()],['File: Delete Active File',()=>delCur()],['File: Save',()=>{save();dirty={};tabsR();toast('Saved')}],['Go to Line\u2026',()=>openPal(':')],['View: Toggle Terminal',()=>panel()],['Run: Run Active File',()=>runFile()],['View: Close All Editors',()=>{open=[];cur=null;showWel()}],['Preferences: Reset Workspace',()=>{if(confirm('Reset all files to the default workspace?')){files=JSON.parse(JSON.stringify(SEED));save();open=[];cur=null;showWel();renderSide()}}],['Developer: Reload Window',()=>location.reload()]];
function openPal(pre,hold,cb){askCb=cb||null;$('#pal').hidden=false;$('#pbd').hidden=false;pi.value=pre||'';pi.placeholder=hold||'Search files by name (add : for line, > for commands)';pi.focus();rp()}
function ask(hold,cb,pre){openPal(pre||'',hold,cb)}
function closePal(){$('#pal').hidden=true;$('#pbd').hidden=true;askCb=null;pi.blur()}
function rp(){const q=pi.value;if(askCb){items=[];$('#pl').innerHTML='';return}
 if(q[0]=='>'){const t=q.slice(1).trim().toLowerCase();items=CM.filter(c=>c[0].toLowerCase().includes(t)).map(c=>({l:c[0],run:c[1]}))}
 else if(q[0]==':'){const n=parseInt(q.slice(1));items=[{l:n?'Go to line '+n:'Type a line number to go to',run:()=>n&&goto(n)}]}
 else{const t=q.toLowerCase();items=Object.keys(files).filter(f=>f.toLowerCase().includes(t)).map(f=>({l:f.split('/').pop(),d:f.includes('/')?f.slice(0,f.lastIndexOf('/')):'',f,run:()=>openFile(f)}))}
 sel=0;pr()}
function pr(){$('#pl').innerHTML=items.map((x,i)=>'<div class="pi'+(i==sel?' s':'')+'" data-i="'+i+'">'+(x.f?fi(x.f):'')+'<span>'+esc(x.l)+'</span><em>'+esc(x.d||'')+'</em></div>').join('')||(askCb?'':'<div class="pe">No matching results</div>')}
function pick(x){closePal();x&&setTimeout(x.run,0)}
pi.oninput=rp;
pi.onkeydown=e=>{if(e.key=='Enter'){if(askCb){const v=pi.value,f=askCb;closePal();f(v)}else pick(items[sel])}
 else if(e.key=='Escape')closePal();else if(e.key=='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,items.length-1);pr()}else if(e.key=='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);pr()}};
$('#pl').onclick=e=>{const r=e.target.closest('.pi');r&&pick(items[+r.dataset.i])};
$('#pbd').onclick=closePal;
/* ---------- panel / terminal ---------- */
const PT=[['prob','PROBLEMS'],['out','OUTPUT'],['dbg','DEBUG CONSOLE'],['term','TERMINAL']],MS={prob:'No problems have been detected in the workspace.',out:'',dbg:'The debug console is not available in this workspace.'};
function panelR(){$('#phd').innerHTML=PT.map(t=>'<button data-t="'+t[0]+'" class="'+(t[0]==ptab?'a':'')+'">'+t[1]+'</button>').join('')+'<i></i><button id="px">'+ic('close')+'</button>';$('#term').hidden=ptab!='term';$('#msg').hidden=ptab=='term';$('#msg').textContent=MS[ptab]||''}
function panel(f){const p=$('#panel');p.hidden=f===undefined?!p.hidden:!f;if(!p.hidden){panelR();ptab=='term'&&!matchMedia('(pointer:coarse)').matches&&$('#tin').focus()}}
$('#phd').onclick=e=>{if(e.target.closest('#px'))return panel(false);const b=e.target.closest('[data-t]');if(b){ptab=b.dataset.t;panelR()}};
$('#term').onclick=()=>$('#tin').focus();
const tout=$('#tout');
function tp(s,c){const d=document.createElement('div');d.textContent=s;if(c)d.className=c;tout.appendChild(d);$('#pb').scrollTop=1e9}
function runJs(src){const f=(...a)=>tp(a.map(x=>typeof x=='object'?JSON.stringify(x):String(x)).join(' '));try{new Function('console',src)({log:f,info:f,warn:f,error:(...a)=>tp(a.join(' '),'er')})}catch(e){tp(e.name+': '+e.message,'er')}}
function exec(l){tp('workspace $ '+l,'pr');const[c,...a]=l.trim().split(/\s+/);
 switch(c){case'':break;case'help':tp('Commands: help, ls, cat <file>, node <file>, npm start, echo, pwd, date, clear');break;
 case'ls':Object.keys(files).sort().forEach(f=>tp(f));break;
 case'cat':files[a[0]]!=null?tp(files[a[0]]):tp('cat: '+a[0]+': No such file or directory','er');break;
 case'node':files[a[0]]!=null?runJs(files[a[0]]):tp('Error: Cannot find module \''+a[0]+'\'','er');break;
 case'npm':a[0]=='start'&&files['src/main.js']!=null?(tp('> workspace@1.0.0 start'),tp('> node src/main.js'),runJs(files['src/main.js'])):tp('npm: unsupported command','er');break;
 case'echo':tp(a.join(' '));break;case'pwd':tp('/workspace');break;case'date':tp(new Date().toString());break;case'clear':tout.innerHTML='';break;
 default:tp(c+': command not found','er')}}
$('#tin').onkeydown=e=>{if(e.key=='Enter'){const v=e.target.value;e.target.value='';exec(v)}};
tp('Type "help" to list available commands.');
function runFile(){if(!cur)return toast('Open a file to run');const e=ext(cur);
 if(e=='html'||e=='htm')return preview();
 if(e=='js'||e=='mjs'){ptab='term';panel(true);exec('node '+cur)}else toast(e=='lua'||e=='luau'?'Lua has no runner here \u2014 run it in your executor':'No runner for .'+e+' files')}
function preview(){let h=files[cur];h=h.replace(/<link[^>]*href=["']([^"']+)["'][^>]*>/g,(m,p)=>files[p]!=null?'<style>'+files[p]+'</style>':m).replace(/<script([^>]*?)src=["']([^"']+)["']([^>]*)><\/script>/g,(m,a,p,b)=>files[p]!=null?'<script'+a+b+'>'+files[p]+'<\/script>':m);$('#pv iframe').srcdoc=h;$('#pv').hidden=false}
$('#pvx').onclick=()=>{$('#pv').hidden=true;$('#pv iframe').srcdoc=''};
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}
/* ---------- chrome ---------- */
$('#mb').innerHTML=ic('menu');$('#run').innerHTML=ic('play');$('#more').innerHTML=ic('more');$('#pvx').innerHTML=ic('close');
$('#cc').innerHTML=ic('search')+'<span>workspace</span>';
$('#mb').onclick=()=>{renderSide();drawer(true)};$('#cc').onclick=()=>openPal('');$('#run').onclick=runFile;$('#more').onclick=()=>openPal('>');
$('#sb').innerHTML='<div><span class="rm">'+ic('remote')+'</span><span>'+ic('git')+'main</span><span>'+ic('refresh')+'</span><span id="sprob">'+ic('err')+'0 '+ic('warn')+'0</span></div><div><span id="spos"></span><span>Spaces: 2</span><span class="w">UTF-8</span><span class="w">LF</span><span id="slang"></span><span>'+ic('bell')+'</span></div>';
$('#spos').onclick=()=>cur&&openPal(':');$('#sprob').onclick=()=>{ptab='prob';panel(true)};

wel.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;a=='t'?panel(true):a=='n'?newFile():a=='u'?pickFiles():openPal(a)};
addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;
 if(m&&k=='s'){e.preventDefault();save();dirty={};tabsR();toast('Saved')}
 else if(m&&k=='p'){e.preventDefault();openPal(e.shiftKey?'>':'')}
 else if(e.ctrlKey&&k=='`'){e.preventDefault();panel()}});

vv&&(vv.addEventListener('resize',fit),vv.addEventListener('scroll',fit));addEventListener('resize',fit);fit();
